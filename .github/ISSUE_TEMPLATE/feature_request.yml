name: Feature request
description: Suggest something new for the bridge. Not for setup help.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **Issues are not for setup help.** Setup questions and "how do I...?" go in the **[community room](https://matrix.to/#/#corten-matrix:beeper.com)**. Setup instructions are on [corten-matrix.com](https://corten-matrix.com).

        ### One developer. Bugs come first.

        Corten-Matrix is built and maintained by one person, in their spare time. Serious bugs come first, then minor bugs, then feature requests. Feature requests are read, and good ones get built eventually, but never ahead of a bug. Some won't happen at all.

        ### How to give us your Matrix ID (required, and kept private only this way)

        We fix bugs by working with you directly on Matrix. **Don't put your Matrix ID in this form.** Instead:

        1. Submit this issue.
        2. **Within 1 hour**, reply to it with a comment that contains **only** your Matrix ID, like `@you:beeper.com`.
        3. A bot deletes that comment within seconds and sends your ID privately to the maintainers.

        - **No reply within 1 hour:** the issue is closed automatically.
        - **Matrix ID put anywhere else** (title, this form, any other comment): it's public, and the issue is closed and locked. If that happens, it's because the steps above weren't followed.
        - Your reply is visible on GitHub for a few seconds before the bot removes it, and may be included in email notifications to people watching this repository.

  - type: input
    id: room_display_name
    attributes:
      label: If you're already in our Matrix room, what's your display name?
      description: Optional. The name people see you as in the room, so we know who you are. Not your Matrix ID.
      placeholder: "e.g. Jane, or jane-bridges"
    validations:
      required: false

  - type: textarea
    id: request
    attributes:
      label: What would you like?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The problem it solves for you.
    validations:
      required: false

  - type: checkboxes
    id: agreements
    attributes:
      label: Before you submit
      options:
        - label: This is a feature request, not a setup question. Setup questions go in the community room.
          required: true
        - label: I understand feature requests come after bugs and may wait a long while, or not happen at all.
          required: true
        - label: I will reply with only my Matrix ID as a comment within 1 hour, and I won't put it anywhere else.
          required: true
